services:
  # 1. FastAPI Python Engine
  - type: web
    name: valuation-engine-api
    runtime: python
    region: singapore
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: SQLITE_DB_PATH
        value: "/var/data/valuation_studio.db"
    disk:
      name: valuation-data
      mountPath: /var/data
      sizeGB: 1

  # 2. React Vite Web UI
  - type: static_site
    name: valuation-scenario-ui
    region: singapore
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: VITE_API_URL
        value: https://valuation-engine-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
